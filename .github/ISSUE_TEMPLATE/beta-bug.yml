name: Beta bug report
description: Report a problem reproduced with synthetic data only.
title: '[Beta] '
body:
  - type: checkboxes
    attributes:
      label: Data safety
      options:
        - label: I used dummy data and removed all passwords, vault files, personal details and secrets from this report.
          required: true
  - type: input
    attributes:
      label: Build identifier
      description: Commit SHA or workflow run URL, installer format and package version.
    validations:
      required: true
  - type: input
    attributes:
      label: Platform
      description: OS version, CPU architecture, desktop environment/display scaling if relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Use fictional names and values only.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized diagnostics
      description: Paste only reviewed/redacted error text. Never upload vaults, CSVs, heap dumps or master passwords.
