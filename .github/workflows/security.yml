name: Dependency security
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  osv:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:list -DoutputFile=target/dependencies.txt
      - run: python tools/check-dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-security
          path: |
            target/dependency-security.json
            target/dependencies.txt
          retention-days: 7
          if-no-files-found: error
